name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: git ls-files '*.h' '*.cpp' | xargs clang-format-18 --dry-run --Werror
      - name: Test Metal diagnostic orchestration without GPU or cache access
        run: python3 -B .github/scripts/test-diagnose-metal.py

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC Debug",          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Debug,   generator: Ninja }
          - { name: "Linux Clang Release",      os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release, generator: Ninja }
          - { name: "Linux Clang Dist",         os: ubuntu-24.04, cc: clang, cxx: clang++, config: Dist,    generator: Ninja, extra: "-DPX_BUILD_EDITOR=OFF" }
          - { name: "Linux GCC ASan+UBSan",     os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Debug,   generator: Ninja, extra: "-DPX_SANITIZERS=address,undefined" }
          - { name: "Linux Clang TSan",         os: ubuntu-24.04, cc: clang, cxx: clang++, config: Debug,   generator: Ninja, extra: "-DPX_SANITIZERS=thread", tsan: true }
          - { name: "Windows MSVC Debug",       os: windows-2025, config: Debug,   generator: "Visual Studio" }
          - { name: "Windows MSVC Release",     os: windows-2025, config: Release, generator: "Visual Studio" }
          - { name: "Windows MSVC Dist",        os: windows-2025, config: Dist,    generator: "Visual Studio", extra: "-DPX_BUILD_EDITOR=OFF" }
          - { name: "macOS AppleClang Debug",   os: macos-15,     config: Debug,   generator: Ninja }
          - { name: "macOS AppleClang Release", os: macos-15,     config: Release, generator: Ninja }

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            mesa-vulkan-drivers vulkan-validationlayers libvulkan1 xvfb xauth
          # GPU tests run on lavapipe (software Vulkan) and must not be skipped on Linux.
          echo "PX_REQUIRE_GPU=1" >> "$GITHUB_ENV"

      - name: Install Windows Vulkan driver (lavapipe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Mesa's software Vulkan driver, pinned by SHA-256. The loader ignores VK_DRIVER_FILES in elevated
          # processes, so the driver is registered in HKLM instead.
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\mesa.7z" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695") { throw "mesa archive hash mismatch: $hash" }
          7z x "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" "x64\lvp_icd.x86_64.json" "x64\vulkan_lvp.dll" | Out-Null
          $icd = "$env:RUNNER_TEMP\mesa\x64\lvp_icd.x86_64.json"
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          "PX_REQUIRE_GPU=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          # Best effort: MoltenVK over the runner's paravirtual GPU. GPU tests skip with a warning if unavailable.
          brew install vulkan-loader molten-vk || true
          brew install vulkan-validationlayers
          validation_prefix="$(brew --prefix vulkan-validationlayers)"
          python3 - "$validation_prefix" "$RUNNER_TEMP/paralax-vulkan-layers" <<'PY'
          import json
          from pathlib import Path
          import sys
          prefix, destination = map(Path, sys.argv[1:])
          manifest = prefix / "share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json"
          library = prefix / "lib/libVkLayer_khronos_validation.dylib"
          if not library.is_file():
              raise RuntimeError(f"Validation library is missing: {library}")
          data = json.loads(manifest.read_text())
          data["layer"]["library_path"] = str(library.resolve())
          destination.mkdir(parents=True, exist_ok=True)
          (destination / manifest.name).write_text(json.dumps(data))
          PY
          echo "VK_LAYER_PATH=$RUNNER_TEMP/paralax-vulkan-layers" >> "$GITHUB_ENV"
          echo "VK_LAYER_VALIDATE_SYNC=1" >> "$GITHUB_ENV"

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'cmake/patches/**') }}

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DPX_BUILD_TESTS=ON ${{ matrix.extra }})
          # "Visual Studio" means CMake's default generator on Windows: the newest installed Visual Studio.
          if [[ "${{ matrix.generator }}" == "Ninja" ]]; then
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          if [[ -n "${{ matrix.cc }}" ]]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          .github/scripts/run-step.sh Configure cmake "${args[@]}"

      - name: Build
        shell: bash
        run: .github/scripts/run-step.sh Build cmake --build build --config ${{ matrix.config }} --parallel

      - name: Configure sanitizer suppressions
        if: matrix.tsan
        shell: bash
        run: echo "TSAN_OPTIONS=suppressions=${{ github.workspace }}/tools/sanitizers/tsan.supp" >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: .github/scripts/run-step.sh "Unit tests" ctest --test-dir build --build-config ${{ matrix.config }} --parallel 4 --timeout 300 --no-tests=error

      - name: Compare macOS lighting after clearing the runner Metal cache
        if: always() && runner.os == 'macOS' && matrix.config == 'Debug'
        shell: bash
        run: python3 .github/scripts/diagnose-metal.py build

      - name: Compare CPU and GPU contention in macOS Release lighting
        if: always() && runner.os == 'macOS' && matrix.config == 'Release'
        shell: bash
        run: python3 .github/scripts/diagnose-metal.py build --config Release --contention-only

      - name: Headless smoke test
        shell: bash
        run: |
          bin=build/bin
          [[ -d "build/bin/${{ matrix.config }}" ]] && bin="build/bin/${{ matrix.config }}"
          exes=(Paralax-Runtime)
          [[ "${{ matrix.extra }}" != *"PX_BUILD_EDITOR=OFF"* ]] && exes+=(Paralax-Editor)
          for exe in "${exes[@]}"; do
            path="$bin/$exe"
            [[ -f "$path.exe" ]] && path="$path.exe"
            if [[ ! -f "$path" ]]; then
              echo "::error::$exe was not built (looked for $path)"
              exit 1
            fi
            args=(--headless --frames 10 --fixed-timestep 0.016)
            # The runtime needs a game: play the feature test project, failing on any script error (also covers
            # Dist builds, which have no test binary).
            [[ "$exe" == Paralax-Runtime ]] && args=(--project Paralax-Tests/FeatureTest --headless --frames 60 --fixed-timestep 0.0166667 --fail-on-script-error)
            .github/scripts/run-step.sh "Smoke test $exe" "$path" "${args[@]}"
          done

      - name: Upload test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-${{ matrix.config }}-${{ strategy.job-index }}
          path: build/Paralax-Tests/TestOutput
          if-no-files-found: ignore
          retention-days: 7
