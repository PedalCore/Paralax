name: macOS analytic indexed mesh diagnostic
on:
  push:
    branches: [ci/mac-mesh-offsets]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PX_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
      - uses: actions/checkout@v5
        with:
          ref: 3f51e29d792194300dfa6ba66d20081dd0ab00e1
          path: source
      - name: Install Vulkan dependencies
        run: |
          test "$(uname -m)" = arm64
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew install vulkan-loader molten-vk
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('source/cmake/Dependencies.cmake', 'source/cmake/CPM.cmake', 'source/cmake/patches/**') }}
      - name: Verify and install generic diagnostic source
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          source = Path('harness/.github/diagnostics/MeshOffsetRenderingTests.cpp').read_bytes()
          assert hashlib.sha256(source).hexdigest() == '19021e9ba8b8dd630a20584d3e8ce9fa13168da483758c64b26bf4f88958ee1a'
          Path('source/Paralax-Tests/src/Renderer/MeshOffsetRenderingTests.cpp').write_bytes(source)
          PYTHON
      - name: Configure and build Release tests
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p evidence
          cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPX_BUILD_EDITOR=OFF -DPX_BUILD_TESTS=ON 2>&1 | tee evidence/configure.log
          cmake --build build --target Paralax-Tests --parallel 4 2>&1 | tee evidence/build.log
      - name: Run independent analytic mesh oracles
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --parallel 1 --timeout 300 --no-tests=error -R '^MeshOffsets:' 2>&1 | tee evidence/tests.log
      - name: Preserve generic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-mesh-offsets
          path: |
            evidence
            build/Paralax-Tests/TestOutput
            build/Testing/Temporary
          if-no-files-found: error
          retention-days: 14
